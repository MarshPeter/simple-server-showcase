# Local development: the app plus a local Postgres that stands in for Neon.
#   docker compose up --build   ->  http://localhost:8000
# To use Neon instead, put DATABASE_URL in .env and run just the app:
#   docker compose up --build app --no-deps
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/todos}
      RESET_TOKEN: ${RESET_TOKEN:-}
      MAX_TODOS: ${MAX_TODOS:-200}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
